<!doctype html>
<html lang="en">
  <head>

    <title>DEMAYORTECH - QUIZ APP</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="shortcut icon" href="./assets/logo.jpeg" type="image/x-icon" />

  <body>
    <div class="container">
      <div class="quiz_container">
        <div class="quiz_details">

          <p id="timer">30</p>

        <!-- quizzes -->

          <p id="question">1. Questions goes here</p>

          <div class="quiz_options">

            <button>Option 2</button>
            <button>Option 3</button>
            <button>Option 4</button>
          </div>
        </div>

        <!-- next question -->
        <button id="next_cta">Next</button>
      </div>
    </div>
    <script src="./js/app.js" type="module"></script>
  </body>
</html>
